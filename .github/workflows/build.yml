name: Build mods

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [forge-1.19.2, forge-1.20.1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew build --no-daemon 2>&1 | tee build.log; then
            # Resume os erros numa anotacao (visivel pela API de check-runs)
            msg=$(grep -E "error:|What went wrong|Could not|FAILED" -A3 build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Erros de compilacao (${{ matrix.project }})::${msg}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NetheriteSupremo-${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error

  server-test:
    # Sobe um servidor Forge 1.20.1 com o mod e cria um mundo novo (reproduz o carregamento do mundo)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Servidor de teste (forge-1.20.1)
        run: |
          chmod +x forge-1.20.1/gradlew
          python3 .github/scripts/server_test.py forge-1.20.1

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: NetheriteSupremo-*
          merge-multiple: true

      - name: Publicar release com os jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "build-${{ github.run_number }}" dist/*.jar \
            --repo "${{ github.repository }}" \
            --title "Netherite Supremo (build ${{ github.run_number }})" \
            --notes "Jars compilados para Forge 1.19.2 e 1.20.1."
