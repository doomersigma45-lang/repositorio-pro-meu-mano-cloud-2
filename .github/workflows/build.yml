name: Build mods

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [forge-1.19.2, forge-1.20.1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NetheriteSupremo-${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: NetheriteSupremo-*
          merge-multiple: true

      - name: Publicar release com os jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "build-${{ github.run_number }}" dist/*.jar \
            --repo "${{ github.repository }}" \
            --title "Netherite Supremo (build ${{ github.run_number }})" \
            --notes "Jars compilados para Forge 1.19.2 e 1.20.1."
