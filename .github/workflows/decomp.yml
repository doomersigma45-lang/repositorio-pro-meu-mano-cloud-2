name: Decompile
on:
  push:
    branches: [decomp]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Gradle caches (mappings)
        run: |
          cd forge-1.20.1 && chmod +x gradlew && ./gradlew --no-daemon compileJava -q || true
          find ~/.gradle -iname "*joined*" -o -iname "*client*mappings*" -o -iname "mcp_config*" | head -20
      - name: CFR
        run: |
          curl -sSL -o cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          for n in viladeferro claude_content; do java -jar cfr.jar _port/$n.jar --outputdir _port/src_$n --silent true || true; done
      - name: Map names
        run: |
          python3 - <<'PY'
          import glob,os,re,zipfile
          home=os.path.expanduser('~/.gradle')
          tsrg=None; off=None
          for f in glob.glob(home+'/**/*',recursive=True):
              b=os.path.basename(f)
              if b=='joined.tsrg' and not tsrg: tsrg=open(f).read()
              if b.endswith('.zip') and 'mcp_config' in f and not tsrg:
                  z=zipfile.ZipFile(f)
                  for n in z.namelist():
                      if n.endswith('joined.tsrg'): tsrg=z.read(n).decode()
              if 'client' in b and 'mappings' in b and b.endswith('.txt') and not off: off=open(f).read()
          print('tsrg',bool(tsrg),'official',bool(off))
          # official: "mojang.Class -> obf:" then "    type name -> obf"
          o2m={}; cur=None
          for l in (off or '').splitlines():
              if l.startswith('#') or not l.strip(): continue
              if not l.startswith(' '):
                  m,ob=l.rstrip(':').split(' -> '); ob=ob.replace('.','/'); cur=ob; o2m[(ob,None)]=m
              else:
                  p=l.strip().split(' -> '); ob=p[1]; left=p[0]
                  name=left.split(' ')[-1].split('(')[0]
                  o2m[(cur,ob)]=name
          s2n={}; cur=None
          for l in (tsrg or '').splitlines():
              if not l.startswith('\t'):
                  cur=l.split(' ')[0].replace('.','/')
              else:
                  p=l.strip().split(' ')
                  obf=p[0]; srg=p[-1]
                  if srg.startswith(('m_','f_')):
                      nm=o2m.get((cur,obf))
                      if nm: s2n[srg]=nm
          print('mapped',len(s2n)); print(list(o2m.items())[:3]); print(tsrg[:300])
          rx=re.compile(r'\b[mf]_\d+_\b')
          for root in glob.glob('_port/src_*'):
              for f in glob.glob(root+'/**/*.java',recursive=True):
                  t=open(f).read(); t2=rx.sub(lambda m:s2n.get(m.group(0),m.group(0)),t)
                  open(f,'w').write(t2)
          PY
          rm -f cfr.jar
      - name: Commit result
        run: |
          git config user.name ci; git config user.email ci@x
          git add -A _port; git commit -qm "decompiled" || true
          git push origin HEAD:decomp-out -f
